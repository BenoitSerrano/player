<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bartholomé</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 id="word"></h1>

      <div class="player">
        <audio id="audio" controls autoplay></audio>
        <button id="next">Suivant ↗</button>
      </div>
    </main>

    <script>
      const BASE_URL =
        "https://player-bartholome.s3.eu-west-par.io.cloud.ovh.net/";
      const tracks = [
        {
          url: `${BASE_URL}benoit.mp3`,
          word: "Benoit",
        },
        {
          url: `${BASE_URL}claire.mp3`,
          word: "Claire",
        },
        {
          url: `${BASE_URL}valerie.mp3`,
          word: "Valérie",
        },
        {
          url: `${BASE_URL}mahalia.mp3`,
          word: "Mahalia",
        },
        {
          url: `${BASE_URL}caroline.mp3`,
          word: "Caroline",
        },
        {
          url: `${BASE_URL}clara.mp3`,
          word: "Clara",
        },
        {
          url: `${BASE_URL}diamond.mp3`,
          word: "Diamond",
        },
        {
          url: `${BASE_URL}elise.mp3`,
          word: "Elise",
        },
        {
          url: `${BASE_URL}francis.mp3`,
          word: "Francis",
        },
        {
          url: `${BASE_URL}guido.mp3`,
          word: "Guido",
        },
        {
          url: `${BASE_URL}helene.mp3`,
          word: "Hélène",
        },
        {
          url: `${BASE_URL}mona.mp3`,
          word: "Mona",
        },
        {
          url: `${BASE_URL}rime.mp3`,
          word: "Rime",
        },
        {
          url: `${BASE_URL}sofia.mp3`,
          word: "Sofia",
        },
        {
          url: `${BASE_URL}shannie.mp3`,
          word: "Shannie",
        },
      ];

      const audio = document.getElementById("audio");
      const word = document.getElementById("word");
      const nextButton = document.getElementById("next");

      let currentIndex = -1;

      function playRandomTrack() {
        if (tracks.length === 0) return;

        let nextIndex;

        do {
          nextIndex = Math.floor(Math.random() * tracks.length);
        } while (tracks.length > 1 && nextIndex === currentIndex);

        currentIndex = nextIndex;

        const track = tracks[currentIndex];

        word.textContent = track.word;
        const [color1, color2] = randomGradient();

        document.body.style.setProperty("--color-start", color1);

        document.body.style.setProperty("--color-end", color2);

        audio.src = track.url;
        audio.load();

        audio.play().catch(() => {});
      }

      nextButton.addEventListener("click", playRandomTrack);

      audio.addEventListener("ended", playRandomTrack);

      playRandomTrack();

      function randomGradient() {
        const hue = Math.floor(Math.random() * 360);
        const hue2 = (hue + 45 + Math.random() * 25) % 360;

        const saturation = 75;
        const lightness = 58;

        return [
          `hsl(${hue}, ${saturation}%, ${lightness}%)`,
          `hsl(${hue2}, ${saturation}%, ${lightness}%)`,
        ];
      }
    </script>
  </body>
</html>
